[project]
name = "social-conflicts-peru"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.13.0",
    "bs4>=0.0.2",
    "camelot-py>=1.0.9",
    "datasets>=4.6.1",
    "evaluate>=0.4.6",
    "fastexcel>=0.19.0",
    "fitz>=0.0.1.dev2",
    "googletrans>=4.0.2",
    "httpx>=0.28.1",
    "ipykernel>=7.2.0",
    "ipython>=9.0.2",
    "jinja2>=3.1",
    "loguru>=0.7.3",
    "lxml>=5.3.1",
    "nltk>=3.9.2",
    "numpy>=2.4.2",
    "pandas>=2.2.3",
    "pathlib>=1.0.1",
    "polars>=1.38.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pymupdf>=1.25.4",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.46",
    "tqdm>=4.67.3",
    "transformers[torch]>=5.3.0",
    "wordcloud>=1.9.6",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["social_conflicts_peru*"]
exclude = ["data*", "logs*", "draft_notebooks*"]
